# The iOS app's Xcode project, made by XcodeGen (`xcodegen` in this folder): the project
# file itself isn't kept. `scripts/build-core.sh` builds the core it links first.
name: Detour
options:
  bundleIdPrefix: dev.detour
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    majorVersion: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Detour:
    type: application
    platform: iOS
    sources:
      - path: Detour
      - path: Generated
    dependencies:
      - package: SwiftTerm
      - framework: Frameworks/DetourCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: LocalAuthentication.framework
    info:
      path: Detour/Info.plist
      properties:
        CFBundleDisplayName: Detour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSFaceIDUsageDescription: Detour opens your vault with Face ID.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DETOUR_BUNDLE_ID)
        DETOUR_BUNDLE_ID: dev.detour.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: ["-lc++", "-lresolv"]
