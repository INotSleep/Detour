name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The message you saw, if any, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a host with ...
        2. Click Connect
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Detour version
      description: Settings → About → Version
      placeholder: 0.1.0 · windows
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the server's SSH version, how the team is stored (Git or folder). Remove addresses, keys and passwords.
