# Tests on every push and pull request that touches code. Installers for macOS and Linux,
# and the command line alone for servers, on a tag `v*` (into a draft release) or when run
# by hand: macOS minutes are expensive on private repositories. Windows installers are signed with a code signing
# certificate that lives in SimplySign, so they are built and added to the release on the
# maintainer's computer: scripts/release-windows.ps1.
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    # Docs alone need no build. Tags are built whatever changed.
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in test builds: a smaller cache and faster linking (PDBs on Windows).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # A tag points at a commit already tested on main, so a tag only builds installers.
  test:
    name: Test (${{ matrix.os }})
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # WebView for Tauri; sftp-server for the SFTP tests (Windows has Git's, macOS its own).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev openssh-sftp-server

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Type checks the UI and builds dist/, which the Tauri crate embeds.
      - name: Build the UI
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace --locked

  bundle:
    name: Installers (${{ matrix.os }})
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          # One app for Apple Silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Builds the installers, with the command line inside (tauri.bundle.conf.json); on a tag,
      # also attaches them to a draft release, with the signed update files and latest.json
      # the app's updater reads.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Detour ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: detour-${{ runner.os }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.sig
            target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

  # The command line alone, for servers without a desktop: `detour` in a .tar.gz with its
  # SHA-256. Windows' is built and signed with the installers (scripts/release-windows.ps1).
  cli:
    name: Command line (${{ matrix.name }})
    needs: bundle
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          # One binary for Apple Silicon and Intel Macs.
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          if [ "${{ runner.os }}" = macOS ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do cargo build -p detour-cli --release --locked --target $t; done
            lipo -create -output detour target/aarch64-apple-darwin/release/detour target/x86_64-apple-darwin/release/detour
          else
            cargo build -p detour-cli --release --locked
            cp target/release/detour detour
          fi
          name=detour-cli-$version-${{ matrix.name }}.tar.gz
          tar czf "$name" detour
          shasum -a 256 "$name" > "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: detour-cli-${{ matrix.name }}
          path: detour-cli-*.tar.gz*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber -R "$GITHUB_REPOSITORY"
