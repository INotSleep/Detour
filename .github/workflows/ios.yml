name: iOS

on:
  push:
    branches: [ios]
    paths: ["ios/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      appstore:
        description: Also upload to App Store Connect
        type: boolean
        default: false
      screenshots:
        description: App Store screenshots from the simulator
        type: boolean
        default: false
      screens:
        description: "Screens to shoot (default: the App Store ones), e.g. hosts keyskb editor sessions settings"
        type: string
        default: ""
      language:
        description: "Language of the shots (en, ru, uk, de, es, pt-BR, zh-Hans)"
        type: string
        default: en
      uitest:
        description: Drag tests in the simulator
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS app
    runs-on: macos-latest
    env:
      # Ad hoc signing; without these the app is only built for the simulator.
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      # App Store: its provisioning profile and an App Store Connect API key (Key ID, Issuer ID, .p8 in base64).
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: XcodeGen
        run: brew install xcodegen

      - name: The core for iOS
        run: ios/scripts/build-core.sh release

      - name: Xcode project
        run: cd ios && xcodegen

      - name: Output highlighting check
        run: |
          swiftc -O ios/Detour/Terminal/Highlight.swift ios/Tests/HighlightCheck/main.swift -o "$RUNNER_TEMP/highlight-check"
          "$RUNNER_TEMP/highlight-check"

      - name: Simulator build
        run: |
          xcodebuild -project ios/Detour.xcodeproj -scheme Detour -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - name: Drag tests
        if: inputs.uitest
        run: ios/scripts/uitest.sh

      - uses: actions/upload-artifact@v7
        if: inputs.uitest
        with:
          name: Detour-ios-uitest
          path: ios/build/uitest/
          retention-days: 7

      - name: App Store screenshots
        if: inputs.screenshots
        env:
          DETOUR_SHOT_SCREENS: ${{ inputs.screens }}
          DETOUR_SHOT_LANG: ${{ inputs.language }}
        run: ios/scripts/screenshots.sh

      - uses: actions/upload-artifact@v7
        if: inputs.screenshots
        with:
          name: Detour-ios-screenshots
          path: |
            ios/build/screenshots/*.png
            ios/build/screenshots/*.txt
          retention-days: 14

      - name: Ad hoc build
        if: env.IOS_PROFILE_BASE64 != ''
        run: ios/scripts/sign.sh

      - uses: actions/upload-artifact@v7
        if: env.IOS_PROFILE_BASE64 != ''
        with:
          name: Detour-ios-adhoc
          path: ios/build/export/*.ipa
          retention-days: 14

      - name: App Store build and upload
        if: inputs.appstore && env.IOS_APPSTORE_PROFILE_BASE64 != '' && env.ASC_KEY_ID != ''
        run: |
          IOS_PROFILE_BASE64="$IOS_APPSTORE_PROFILE_BASE64" IOS_EXPORT_METHOD=app-store-connect ios/scripts/sign.sh
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios --file ios/build/export/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
