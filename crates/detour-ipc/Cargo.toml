[package]
name = "detour-ipc"
description = "Protocol between the Detour core process and its clients (desktop app, CLI, MCP)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
interprocess = { version = "2.4.7", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "io-util", "time"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
