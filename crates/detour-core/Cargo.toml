[package]
name = "detour-core"
description = "Detour core: SSH sessions, encrypted vaults and serverless team sync. UI-agnostic."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
age = { version = "0.11.5", features = ["armor"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
serde_json.workspace = true
directories = "6.0.0"
uuid = { version = "1.29.0", features = ["v4"] }
rand = { version = "0.10.3", features = ["thread_rng"] }
ed25519-dalek = "3.0.0"
chacha20poly1305 = "0.10.1"
sha2 = "0.10.9"
base64 = "0.22.1"
bech32 = "0.9.1"
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "test-util"] }
serde_json.workspace = true
