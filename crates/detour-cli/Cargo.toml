[package]
name = "detour-cli"
description = "Detour on the command line: `detour`, also the core (`detour daemon`) and the MCP server for agents (`detour mcp`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "detour"
path = "src/main.rs"

[dependencies]
detour-core.workspace = true
detour-daemon = { path = "../detour-daemon" }
detour-ipc = { path = "../detour-ipc" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
rpassword = "7.5.4"
crossterm = "0.29.0"
sys-locale = "0.3.2"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
vt100 = "0.18"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
