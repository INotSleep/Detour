[workspace]
resolver = "3"
members = ["crates/detour-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
detour-core = { path = "crates/detour-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Crypto (scrypt, RSA, ChaCha) is unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
