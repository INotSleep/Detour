[workspace]
resolver = "3"
members = ["crates/detour-core", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
detour-core = { path = "crates/detour-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
